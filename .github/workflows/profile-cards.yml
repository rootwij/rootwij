name: Generate profile cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # metrics renders inside Docker and commits via the GitHub API directly to
      # committer_branch -- it never writes into the workspace, so these steps must
      # run before the git publish step below fetches the branch.
      - name: Stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: stats.svg
          output_action: commit
          committer_branch: output
          committer_message: Update stats card
          base: header, activity, community, repositories

      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: languages.svg
          output_action: commit
          committer_branch: output
          committer_message: Update languages card
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_details: percentage, lines
          plugin_languages_recent_days: 90
          plugin_languages_recent_load: 1000
          plugin_languages_analysis_timeout: 10

      - name: Pacman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Snake contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # Copies into the existing branch instead of force-pushing, so the cards the
      # metrics steps committed above survive.
      - name: Publish contribution graphs to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output
          git worktree add ../output origin/output
          cp dist/*.svg ../output/
          cd ../output
          git switch -C output
          git add -A
          git diff --cached --quiet && echo "No changes to publish" && exit 0
          git commit -m "Update pacman and snake cards"
          git push origin output
