name: Generate profile cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Both card generators fall back to a repo-scoped token when this is blank,
      # which fails in ways that still report success. Fail loudly and early instead.
      - name: Check token secret is set
        env:
          TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::GH_STATS_TOKEN is empty or not set as a repository secret"
            exit 1
          fi
          echo "GH_STATS_TOKEN is set (${#TOKEN} characters)"

      # Runs first: this action writes into dist/ and may clear it.
      - name: Pacman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # Official github-readme-stats action -- renders the same cards as the
      # (currently 503) public instance, so `options` takes the same query string.
      # GH_STATS_TOKEN is a classic PAT with no scopes. GITHUB_TOKEN is repo-scoped
      # and returns "Resource not accessible by integration" for the user-level
      # queries the stats and trophy cards make.
      - name: Stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          path: dist/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: "true"
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_rank=false&theme=dracula&hide_border=false&locale=en

      - name: Languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          path: dist/languages.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: "true"
          options: username=${{ github.repository_owner }}&layout=compact&card_width=320&langs_count=5&theme=dracula&hide_border=false&locale=en

      # Input is `file`, not `output_path` -- the upstream README example is wrong.
      # Non-blocking: this is an unreleased fork branch, and a failure here must not
      # skip the snake/publish steps below and freeze every other card.
      - name: Trophy card
        continue-on-error: true
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GH_STATS_TOKEN }}
          file: dist/trophy.svg
          theme: dracula
          max-cols: "-1"
          max-rows: "1"
          margin-width: "8"
          margin-height: "8"

      - name: Snake contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # github-readme-stats renders a valid SVG saying "Something went wrong" when the
      # API call fails, and fail_on_error does not catch that case. Drop those so the
      # previously published good card survives instead of being overwritten.
      - name: Discard error cards
        run: |
          shopt -s nullglob
          for f in dist/*.svg; do
            if grep -q "Something went wrong" "$f"; then
              echo "::warning::$(basename "$f") rendered an error card - not publishing"
              rm "$f"
            fi
          done

      # Copies into the existing branch instead of force-pushing, so nothing
      # already published is lost.
      - name: Publish cards to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output
          git worktree add ../output origin/output
          cp dist/*.svg ../output/
          cd ../output
          git switch -C output
          git add -A
          git diff --cached --quiet && echo "No changes to publish" && exit 0
          git commit -m "Update profile cards"
          git push origin output
